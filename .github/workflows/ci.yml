#
# Continuous integration on Linux: the CPU checks, the minimum Rust
# version, and the GPU suites on Mesa llvmpipe (a software Vulkan device,
# which shows the kernels compute the right values, not that a hardware
# GPU does). CUDA tests need NVIDIA hardware and are not run. macOS is built
# and tested by the release workflow; a macOS job here was never given a
# runner, so it is left out.

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Public documentation for every feature
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --features gpu,cuda
      - name: Compile the gpu feature (no GPU needed, tests not run)
        run: cargo check --locked --features gpu --all-targets
      - name: Compile the cuda feature (no CUDA needed, hardware tests not run)
        run: cargo check --locked --features cuda --all-targets
      - name: CUDA kernel host emulation (kernel source compiled as C++ on the CPU)
        run: cargo test --locked --features cuda --lib backend::cuda && cargo test --locked --features cuda --test cuda_kernel_emulation

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - name: Build and test at the minimum supported Rust version (1.89, for std::fs::File::try_lock)
        run: cargo test --locked
      - name: Compile every feature at the minimum supported Rust version
        run: cargo check --locked --all-targets --features gpu,cuda

  # The GPU code on a software Vulkan device (Mesa llvmpipe). This runs the
  # WGSL kernels for real, slowly; it says nothing about speed or about
  # any particular GPU's driver.
  gpu-software:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MERSENNE_FORGE_ALLOW_SOFTWARE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Mesa Vulkan drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools && vulkaninfo --summary
      - name: Clippy with the gpu feature
        run: cargo clippy --locked --all-targets --features gpu -- -D warnings
      - name: GPU tests on llvmpipe
        run: cargo test --locked --release --features gpu --lib --test gpu_backend --test protocol_gpu -- --test-threads=1
