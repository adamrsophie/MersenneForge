#
# Release builds. Runs on a pushed version tag (v*) or by hand. Each
# archive holds the binary, the license, and the README; SHA256SUMS covers
# every archive. A tag push attaches the archives to a draft GitHub
# release, which a person publishes after checking it.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read only by default; only the publish job may write (to draft a release).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
            suffix: cpu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: gpu
            suffix: gpu
          - os: macos-latest
            target: aarch64-apple-darwin
            features: ""
            suffix: cpu
          - os: macos-latest
            target: aarch64-apple-darwin
            features: gpu
            suffix: gpu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: Test the release build (CPU tests only)
        if: matrix.features == ''
        run: cargo test --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="mersenne-forge-${GITHUB_REF_NAME}-${{ matrix.target }}-${{ matrix.suffix }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/mersenne-forge" LICENSE README.md "$name/"
          "$name/mersenne-forge" doctor > "$name/doctor.txt" 2>&1 || true
          if [[ "$RUNNER_OS" == macOS ]]; then
            # An app bundle, so a double click opens the control page
            # without a terminal window.
            app="$name/MersenneForge.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "target/${{ matrix.target }}/release/mersenne-forge" "$app/Contents/MacOS/"
            iconset="$RUNNER_TEMP/AppIcon.iconset"
            mkdir -p "$iconset"
            for s in 16 32 128 256 512; do
              sips -z $s $s assets/logo.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
              sips -z $((s * 2)) $((s * 2)) assets/logo.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>mersenne-forge</string>
            <key>CFBundleIdentifier</key><string>io.github.adamrsophie.mersenneforge</string>
            <key>CFBundleName</key><string>MersenneForge</string>
            <key>CFBundleDisplayName</key><string>MersenneForge</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          PLIST
            plutil -lint "$app/Contents/Info.plist"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep "$app"
            "$app/Contents/MacOS/mersenne-forge" --version
          fi
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.suffix }}
          path: "*.tar.gz"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "Release builds. See docs/VALIDATION.md for what was tested." *.tar.gz SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: SHA256SUMS
