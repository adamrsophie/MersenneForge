<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MersenneForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314161b'/%3E%3Cpath d='M7 15h18l-3 4h-4l2 6h-8l2-6h-4z' fill='%23f2ede4'/%3E%3Crect x='13' y='4' width='2' height='8' rx='1' fill='%23ff6a2b'/%3E%3Crect x='17' y='5' width='2' height='7' rx='1' fill='%23ff6a2b'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0f1114; --side: #121418; --panel: #15181d; --panel-2: #1b1e24; --sunk: #0b0c0f;
  --line: #262a31; --line-2: #343944; --fg: #f2ede4; --fg-2: #d6d2ca; --muted: #9aa0aa;
  --accent: #ff6a2b; --accent-soft: rgba(255, 106, 43, 0.11); --on-accent: #14161b;
  --ok: #6fd38c; --ok-bg: rgba(92, 201, 124, 0.12); --warn: #e6b450; --warn-bg: rgba(230, 180, 80, 0.12);
  --blue: #8fb8ff; --violet: #c6a8ff; --teal: #5cc9a7; --pink: #f08fb0;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
a { color: #ff8a52; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.app { min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; }

/* Sidebar */
.side { flex: 1 1 232px; max-width: 264px; padding: 24px 16px; border-right: 1px solid #23272e; background: var(--side); display: flex; flex-direction: column; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand b { display: block; font-size: 15px; letter-spacing: -0.01em; }
.brand span { font: 11px var(--mono); color: var(--muted); }
nav { display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #b4b9c2; text-decoration: none; font-size: 14px; font-weight: 500; }
nav a:hover { background: #191c22; color: var(--fg); }
nav a[aria-current="page"] { background: #1e2128; color: var(--fg); font-weight: 600; }
nav a[aria-current="page"] svg { stroke: var(--accent); }
nav a .count { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid #23272e; border-radius: 12px; background: var(--panel); font-size: 12.5px; color: var(--fg-2); }
.side-foot .cap { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.live { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.off { background: var(--warn); }
.dot.idle { background: var(--muted); }

/* Main */
main { flex: 999 1 560px; min-width: 0; padding: 32px 40px 56px; display: flex; flex-direction: column; gap: 24px; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.head .t { display: flex; flex-direction: column; gap: 4px; margin-right: auto; min-width: 0; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--fg); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: #4a505c; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn svg { width: 16px; height: 16px; }
.card { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 22px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.grow { flex: 999 1 560px; min-width: 0; }
.aside { flex: 1 1 320px; min-width: 0; }
.tag { display: inline-block; font: 600 12px var(--mono); padding: 3px 8px; border-radius: 6px; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.idle { color: #b4b9c2; background: rgba(180, 185, 194, 0.1); }
.pill.hot { color: var(--on-accent); background: var(--accent); }
.bar { height: 10px; border-radius: 999px; background: #23272e; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--c, var(--accent)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stats > div { background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stats span { font-size: 12px; color: var(--muted); font-weight: 600; }
.stats b { font: 600 17px var(--mono); overflow-wrap: anywhere; }
.big-exp { font: 600 clamp(28px, 4vw, 40px) var(--mono); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.empty { border: 1px dashed var(--line-2); border-radius: 16px; padding: 28px; color: var(--fg-2); display: flex; flex-direction: column; gap: 10px; }
.empty code, .note code { font: 12.5px var(--mono); background: var(--sunk); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
pre.raw { margin: 0; padding: 16px 18px; background: var(--sunk); border: 1px solid #22262c; border-radius: 12px; font: 12px/1.75 var(--mono); color: #c8c4bc; white-space: pre-wrap; word-break: break-all; max-height: 520px; overflow: auto; }

/* Tables */
.table { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 600; padding: 13px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid #22262c; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.sel td { background: var(--accent-soft); }
td .line { font: 12px var(--mono); color: #c8c4bc; word-break: break-all; }
.rowbtn { border: 0; background: none; padding: 6px 0; font: 600 14px var(--mono); color: var(--fg); cursor: pointer; text-align: left; min-height: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: #b4b9c2; font-weight: 600; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.chip .n { font: 12px var(--mono); opacity: 0.75; }

/* Form */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 72px; padding: 14px 16px; border-radius: 12px; border: 1px solid #2c3038; background: var(--panel); text-align: left; cursor: pointer; }
.choice b { font-size: 15px; }
.choice span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice:disabled { opacity: 0.45; cursor: not-allowed; }
.choice .top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend, label.l { display: block; padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600; }
.field { display: flex; align-items: center; height: 50px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); overflow: hidden; max-width: 440px; }
.field.bad { border-color: var(--warn); }
.field span { padding: 0 2px 0 14px; font: 18px var(--mono); color: var(--muted); }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 14px 0 8px; font: 600 18px var(--mono); outline: none; }
.field:focus-within { border-color: var(--accent); }
.small-field { height: 44px; max-width: 220px; }
.small-field input { font-size: 15px; padding-left: 14px; }
.help { font-size: 13px; color: var(--muted); margin-top: 8px; }
.help.bad { color: var(--warn); }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.switch { display: flex; align-items: center; gap: 12px; min-height: 44px; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; font-size: 14px; }
.switch i { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line-2); flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); transition: left 0.15s; }
.switch[aria-checked="true"] i { background: var(--accent); }
.switch[aria-checked="true"] i::after { left: 21px; }
.check-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: #c8c4bc; }
.check-list li { display: flex; gap: 10px; }
.check-list svg { flex: none; margin-top: 2px; }
dl.kv { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px 16px; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.note { padding: 14px 16px; border-radius: 12px; background: var(--sunk); border: 1px solid #22262c; font-size: 13px; line-height: 1.55; color: #b4b9c2; }
.warnbox { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: rgba(230, 180, 80, 0.06); border: 1px solid #3a3322; font-size: 13px; color: var(--fg-2); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; padding: 12px 18px; border-radius: 12px; background: var(--fg); color: var(--on-accent); font-weight: 600; font-size: 14px; transition: 0.18s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--warn); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 820px) {
  .side { max-width: none; flex-basis: 100%; border-right: 0; border-bottom: 1px solid #23272e; padding: 14px 16px; gap: 12px; }
  nav { flex-direction: row; overflow-x: auto; }
  nav a { flex: none; }
  .side-foot { display: none; }
  main { padding: 24px 16px 48px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1b1e24"/><rect x="9" y="6" width="2" height="6" rx="1" fill="#ff6a2b"/><rect x="13" y="4" width="2" height="8" rx="1" fill="#ff6a2b"/><rect x="17" y="5" width="2" height="7" rx="1" fill="#ff6a2b"/><rect x="21" y="7" width="2" height="5" rx="1" fill="#ff6a2b"/><path d="M7 15h18l-3 4h-4l2 6h-8l2-6h-4z" fill="#f2ede4"/></svg>
      <div><b>MersenneForge</b><span id="ver">this machine</span></div>
    </div>
    <nav aria-label="Main">
      <a href="#dashboard" data-route="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
      <a href="#queue" data-route="queue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Queue<span class="count" id="qcount"></span></a>
      <a href="#new" data-route="new"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>New assignment</a>
      <a href="#results" data-route="results"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Results</a>
      <a href="#devices" data-route="devices"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg>Devices</a>
    </nav>
    <div class="side-foot">
      <span class="cap">Connection</span>
      <span class="live"><span class="dot" id="conn-dot"></span><span id="conn">Connecting</span></span>
      <span class="muted">Local only. Nothing on this page is sent to PrimeNet.</span>
    </div>
  </aside>
  <main id="view" tabindex="-1" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
(function () {
  const view = document.getElementById("view");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = (n) => (n == null || n === "" || isNaN(Number(n)) ? esc(n) : Number(n).toLocaleString("en-US"));
  const pct = (a, b) => (b > 0 ? Math.min(100, (100 * a) / b) : 0);
  const dur = (s) => {
    s = Math.max(0, Math.round(Number(s) || 0));
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    return d ? d + " d " + h + " h" : h ? h + " h " + m + " min" : m ? m + " min" : s + " s";
  };
  const isPrime = (p) => {
    if (!Number.isInteger(p) || p < 2) return false;
    for (let i = 2; i * i <= p; i++) if (p % i === 0) return false;
    return true;
  };
  const KIND_COLOR = { PRP: "var(--accent)", PRPDC: "var(--accent)", Test: "var(--warn)", DoubleCheck: "var(--warn)", Cert: "var(--teal)", Factor: "var(--violet)", Pminus1: "var(--blue)", Pfactor: "var(--blue)", Pplus1: "var(--teal)", ECM: "var(--pink)", ECM2: "var(--pink)", ECMSTAGE2: "var(--pink)", Fermat: "var(--teal)" };
  const tag = (kind) => '<span class="tag" style="--c:' + (KIND_COLOR[kind] || "var(--muted)") + '">' + esc(kind) + "</span>";
  const check = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6fd38c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';

  let state = null, doctor = null, route = "dashboard", failed = false;
  const ui = { qfilter: "all", rpick: 0, form: { test: "prp", exp: "", backend: "", power: "8", shift: false, from: "", to: "", b1: "", b2: "", curves: "10", run: "1" }, plan: null, planFor: "" };

  const toastEl = document.getElementById("toast");
  let toastTimer;
  function toast(msg, bad) {
    toastEl.textContent = msg;
    toastEl.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = "toast"; }, bad ? 5000 : 2200);
  }

  async function getJSON(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    return r.json();
  }

  async function poll() {
    try {
      state = await getJSON("api/state");
      failed = false;
    } catch (e) {
      failed = true;
    }
    document.getElementById("conn").textContent = failed ? "Server not answering" : "Live, every 5 s";
    document.getElementById("conn-dot").className = "dot" + (failed ? " off" : "");
    if (state) {
      document.getElementById("ver").textContent = "v" + state.version + " · this machine";
      document.getElementById("qcount").textContent = state.queue.length || "";
    }
    // The form and the device page keep their own state; only the live
    // views redraw on a poll.
    if (route === "dashboard" || route === "queue" || route === "results") render();
  }

  function setRoute() {
    const r = (location.hash || "#dashboard").slice(1);
    route = ["dashboard", "queue", "new", "results", "devices"].includes(r) ? r : "dashboard";
    document.querySelectorAll("nav a").forEach((a) => {
      if (a.dataset.route === route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    render();
    view.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function render() {
    if (!state && route !== "devices") {
      view.innerHTML = '<div class="empty">' + (failed ? "The server is not answering. Is <code>mersenne-forge ui</code> still running?" : "Loading") + "</div>";
      return;
    }
    ({ dashboard: dashboardView, queue: queueView, new: newView, results: resultsView, devices: devicesView })[route]();
  }

  // Dashboard
  function protoLabel(p) { return /ll/i.test(p) ? "LL" : /prp/i.test(p) ? "PRP" : String(p || "").toUpperCase(); }

  function dashboardView() {
    const ck = state.checkpoints.filter((c) => !c.error).sort((a, b) => pct(b.k, b.exponent) - pct(a.k, a.exponent));
    const workers = state.workers;
    const running = workers.filter((w) => w.state === "running" || w.state === "working").length;
    let h = '<div class="head"><div class="t"><h1>Dashboard</h1><span class="sub">' +
      fmt(workers.length) + " worker status file" + (workers.length === 1 ? "" : "s") + " · " +
      fmt(state.queue.length) + " assignment" + (state.queue.length === 1 ? "" : "s") + " in <span class=\"mono\">" + esc(state.worktodo) + "</span></span></div>" +
      '<a class="btn primary" href="#new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New assignment</a></div>';

    if (ck.length) {
      const c = ck[0];
      const p = pct(c.k, c.exponent);
      const be = c.backend || {};
      h += '<section class="card" aria-label="Test in progress" style="padding:28px;display:flex;flex-direction:column;gap:22px">' +
        '<div style="display:flex;flex-direction:column;gap:10px"><span class="sub">' + esc(c.file) + (be.kind ? " · " + esc(be.kind) : "") + (be.plan ? " · " + esc(be.plan) : "") + "</span>" +
        '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">' + tag(protoLabel(c.protocol)) + '<span class="big-exp">M' + fmt(c.exponent) + "</span></div></div>" +
        '<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><span class="sub"><span class="mono" style="color:var(--fg)">' + fmt(c.k) + "</span> of " + fmt(c.exponent) + " squarings at the last checkpoint</span>" +
        '<b class="mono" style="font-size:18px">' + p.toFixed(1) + "%</b></div>" +
        '<div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p.toFixed(0) + '"><i style="width:' + p.toFixed(2) + '%"></i></div></div>' +
        '<div class="stats"><div><span>Verified through</span><b>' + fmt(c.verified_k) + "</b></div><div><span>Errors caught</span><b>" + fmt(c.errors) + "</b></div><div><span>Run time</span><b>" + esc(dur(c.elapsed_secs)) + "</b></div><div><span>Speed</span><b>" + (c.k > 0 ? (1000 * c.elapsed_secs / c.k).toFixed(3) + " ms/it" : "n/a") + "</b></div></div></section>";
    } else {
      h += '<div class="empty"><b>No test in progress.</b><span>Pass <code>--checkpoint-dir</code> to see PRP and LL progress from the checkpoints there.' +
        (state.checkpoint_dir ? " None found in <code>" + esc(state.checkpoint_dir) + "</code> yet." : "") + "</span></div>";
    }

    h += '<div class="grid">';
    for (const c of ck.slice(1, 4)) {
      const p = pct(c.k, c.exponent);

  function updateNew() {
    const f = ui.form;
    const digits = String(f.exp).replace(/[^0-9]/g, "");
    const p = digits ? Number(digits) : 0;
    const prime = isPrime(p);
    const needsBackend = ["prp", "ll", "dc", "pm1"].includes(f.test);
    const bes = backendsFromDoctor();
    if (!f.backend) f.backend = (bes.find((b) => b.kind === "dwt" && b.built) || bes[0]).kind;
    const beEl = document.getElementById("be");
    document.getElementById("be-set").hidden = !needsBackend;
    beEl.innerHTML = bes.map((b) => {
      const r = b.supported_exponents;
      const fits = r && (!p || (p >= r[0] && p <= r[1]));
      const off = !b.built || !fits;
      const badge = !b.built ? '<span class="pill idle">Not built</span>' : !fits ? '<span class="pill warn">Out of range</span>' : f.backend === b.kind ? '<span class="pill hot">Selected</span>' : '<span class="pill ok">Ready</span>';
      return '<button type="button" class="choice" data-be="' + esc(b.kind) + '" aria-pressed="' + (f.backend === b.kind && !off) + '"' + (off ? " disabled" : "") + '><span class="top"><b class="mono">' + esc(b.kind) + "</b>" + badge + "</span><span>" + (r ? fmt(r[0]) + " to " + fmt(r[1]) : "not in this build") + "</span></button>";
    }).join("");
    beEl.querySelectorAll("[data-be]").forEach((b) => b.addEventListener("click", () => { f.backend = b.dataset.be; updateNew(); }));
    const chosen = bes.find((b) => b.kind === f.backend);
    const fits = !needsBackend || (chosen && chosen.built && chosen.supported_exponents && p >= chosen.supported_exponents[0] && p <= chosen.supported_exponents[1]);
    const help = document.getElementById("exp-help");
    const box = document.getElementById("expbox");
    let msg = "Enter a prime exponent.", bad = false;
    if (digits && !prime) { msg = fmt(p) + " is not prime, so 2^p minus 1 is composite and needs no test."; bad = true; }
    else if (digits && !fits) { msg = "M" + fmt(p) + " is outside the " + f.backend + " backend's range. Pick another backend."; bad = true; }
    else if (digits) msg = "M" + fmt(p) + " is prime" + (needsBackend ? " and fits the " + f.backend + " backend." : ".");
    help.textContent = msg;
    help.className = "help" + (bad ? " bad" : "");
    box.className = "field" + (bad ? " bad" : "");
    const P = digits || "P";
    const n = (v, d) => String(v || d).replace(/[^0-9]/g, "") || d;
    let line = "", cmd = [];
    const power = Math.min(12, Math.max(5, Number(n(f.power, "8"))));
    switch (f.test) {
      case "prp": line = "PRP=1,2," + P + ",-1"; cmd = ["run --test prp", "--exponent " + P, "--backend " + f.backend, "--proof-power " + power + " --proof-dir work/proof", "--checkpoint-dir work/ckpt"]; break;
      case "ll": line = "Test=" + P; cmd = ["run --test ll", "--exponent " + P, "--backend " + f.backend, "--checkpoint-dir work/ckpt"]; break;
      case "dc": line = "DoubleCheck=" + P; cmd = ["run --test ll", "--exponent " + P, "--backend " + f.backend, "--checkpoint-dir work/ckpt"]; break;
      case "tf": line = "Factor=" + P + "," + n(f.from, "60") + "," + n(f.to, "70"); cmd = ["tf", "--exponent " + P, "--from " + n(f.from, "60") + " --to " + n(f.to, "70")]; break;
      case "pm1": line = "Pminus1=1,2," + P + ",-1," + n(f.b1, "1000000") + "," + n(f.b2, "0"); cmd = ["pm1", "--exponent " + P, "--b1 " + n(f.b1, "1000000") + " --b2 " + n(f.b2, "0"), "--backend " + f.backend]; break;
      case "pp1": line = "Pplus1=1,2," + P + ",-1," + n(f.b1, "1000000") + "," + n(f.b2, "0") + "," + n(f.run, "1"); cmd = ["pp1", "--exponent " + P, "--b1 " + n(f.b1, "1000000") + " --b2 " + n(f.b2, "0"), "--run " + n(f.run, "1")]; break;
      case "ecm": line = "ECM2=1,2," + P + ",-1," + n(f.b1, "1000000") + "," + n(f.b2, "0") + "," + n(f.curves, "10"); cmd = ["ecm", "--exponent " + P, "--b1 " + n(f.b1, "1000000") + " --b2 " + n(f.b2, "0"), "--curves " + n(f.curves, "10")]; break;
    }
    if (f.shift && ["prp", "ll", "dc"].includes(f.test)) cmd.push("--shift " + (1 + Math.floor(Math.random() * Math.max(1, p - 1))));
    if (f.backend === "gpu" || f.backend === "cuda") { if (["prp", "ll", "dc", "pm1"].includes(f.test)) cmd.push("--budget 24h"); }
    document.getElementById("line-out").textContent = line;
    document.getElementById("cmd-out").textContent = "mersenne-forge " + cmd.join(" \\\n  ");
    const facts = {
      prp: ["Gerbicz checks with rollback", "Checkpoints, resumable after a crash", "Proof of power " + power + " verified before the result is written"],
      ll: ["Jacobi check, rewinding to the last verified residue", "Checkpoints, resumable after a crash"],
      dc: ["Jacobi check, rewinding to the last verified residue", "Compare the res64 with the first test"],
    }[f.test] || ["Every factor is checked to divide 2^p minus 1 before it is reported", "Progress is saved, so a stop loses little work"];
    document.getElementById("facts").innerHTML = facts.concat(["The result line is fsynced before the queue moves on"]).map((x) => "<li>" + check + "<span>" + esc(x) + "</span></li>").join("");
    document.getElementById("add").disabled = !(digits && prime && fits);
  }
  async function addToQueue() {

      if (m.error) return "<tr><td class=\"mono\">" + esc(b.kind) + '</td><td colspan="4" style="color:var(--muted)">' + esc(m.error) + "</td></tr>";
      const mb = (x) => (x == null ? "" : (Number(x) / 1048576).toFixed(1) + " MiB");
      return '<tr><td class="mono">' + esc(b.kind) + '</td><td class="mono" style="font-size:12px">' + esc(m.plan) + '</td><td class="mono">' + mb(m.peak_bytes && m.peak_bytes.prp) + '</td><td class="mono">' + mb(m.peak_bytes && m.peak_bytes.ll) + '</td><td class="mono">' + mb(m.peak_bytes && m.peak_bytes.proof_generation) + "</td></tr>";
    }).join("");
    el.innerHTML = '<div class="table"><table style="min-width:560px"><thead><tr><th scope="col">Backend</th><th scope="col">Plan</th><th scope="col">Peak PRP</th><th scope="col">Peak LL</th><th scope="col">Proof generation</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }

  window.addEventListener("hashchange", setRoute);
  setRoute();
  poll();
  setInterval(poll, 5000);
})();
</script>
</body>
</html>
