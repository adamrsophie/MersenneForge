[package]
name = "mersenne-forge"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Rust Mersenne Lucas-Lehmer and base-3 PRP engine with Gerbicz checks and PRP proofs"
license = "GPL-3.0-only"
authors = ["Adam R Sophie <adamrsophie@gmail.com>"]
repository = "https://github.com/adamrsophie/MersenneForge"
readme = "README.md"

[lib]
name = "mersenne_forge"
path = "src/lib.rs"

[[bin]]
name = "mersenne-forge"
path = "src/main.rs"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
cuda = ["dep:cudarc"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
wgpu = { version = "30.0.2", optional = true, default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1.25.2", optional = true, features = ["extern_crate_alloc"] }
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3"

[profile.test]
opt-level = 2
